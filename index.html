<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어 듣기 학습 · 트럼프, 젠슨 황의 엔비디아 복귀 환영</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-active: #1e3a5f;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.18);
    --word-active: #fbbf24;
    --border: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .player-wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    max-height: 34vh;
    background: #000;
  }
  #player {
    width: 100%;
    height: 100%;
  }
  .controls {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
    background: #131c31;
  }
  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:active { transform: scale(0.96); }
  button.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 12px 60px;
  }
  .video-meta {
    margin-bottom: 12px;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .video-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .video-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
  .segment {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .segment.active {
    background: var(--card-active);
    border-color: var(--accent);
  }
  .ts {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
    cursor: pointer;
    user-select: none;
  }
  .words {
    font-size: 17px;
    line-height: 1.75;
    word-break: keep-all;
  }
  .word {
    display: inline-block;
    padding: 1px 3px;
    margin: 0 1px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .word:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  .word.active {
    background: rgba(251, 191, 36, 0.25);
    color: var(--word-active);
    font-weight: 700;
  }
  body.blind .word {
    color: transparent;
    background: #334155;
    border-radius: 5px;
  }
  body.blind .word.peek,
  body.blind .word.active {
    color: var(--word-active);
    background: rgba(251, 191, 36, 0.2);
  }
  .footer-note {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #131c31;
    border: 1px dashed var(--border);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="sticky-top">
  <div class="player-wrap">
    <iframe id="player"
      src="https://www.youtube-nocookie.com/embed/rYnpB9L_1jI?enablejsapi=1&playsinline=1&rel=0"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
  <div class="controls">
    <div class="btn-group">
      <button id="btnPlay" onclick="togglePlay()">▶ 재생</button>
      <button onclick="seekRelative(-3)">⏪ -3초</button>
      <button id="btnLoop" onclick="toggleLoop()">🔁 문장반복</button>
      <button id="btnBlind" onclick="toggleBlind()">🙈 가리기</button>
    </div>
    <div class="btn-group">
      <button class="speed-btn" data-rate="0.75" onclick="setSpeed(0.75)">0.75x</button>
      <button class="speed-btn active" data-rate="1" onclick="setSpeed(1)">1.0x</button>
      <button class="speed-btn" data-rate="1.25" onclick="setSpeed(1.25)">1.25x</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="video-meta">
    <p class="video-title" id="videoTitle"></p>
    <p class="video-hint">단어를 누르면 그 단어의 음성 위치로 바로 이동해 재생됩니다. (가리기 모드에서는 누른 단어만 잠깐 보여요)</p>
  </div>
  <div id="transcript"></div>
  <div class="footer-note">
    Bloomberg Television (2026.11.23) · 유튜브 자동 스크립트 기반
  </div>
</div>

<script>
const VIDEO_DATA = {
  videoId: "rYnpB9L_1jI",
  title: "트럼프, 젠슨 황의 엔비디아 복귀 환영 · Bloomberg Television (2:39)",
  segments: [
    { start: 0, end: 9, text: "assets taking place. Isabelle: S&P futures hitting highs. Nvidia higher in the premarket. I want to bring in Tyler Kendall." },
    { start: 9, end: 16, text: "Can you talk to us about what this will mean for the government. We know that over the weekend --" },
    { start: 16, end: 27, text: "We know that when there were some talks maybe Trump was saying last minute he wants Jensen Huang back and now it's been established there is maybe influence by senior officials." },
    { start: 27, end: 38, text: "Talk about the context of that and what it can be moving forward if we keep having government influence with decisions for companies like Nvidia." },
    { start: 38, end: 46, text: "Tyler: There is no doubt news from this White House as you heard moments ago about this statement from President Trump" },
    { start: 46, end: 55, text: "saying this will ensure the success and prosperity of not only the company but the American economy which could see a little more of an insight into what President Trump was" },
    { start: 55, end: 62, text: "watching here and then as you outline he also seems to claim the U.S. Attorney General confirmed the government does" },
    { start: 62, end: 68, text: "not possess evidence that Jensen Huang has engaged in unlawful conduct but did say he thinks the board should continue to" },
    { start: 68, end: 80, text: "investigate here Nvidia's compliance with U.S. export controls. The U.S. government just sought to tighten in a bid for these assets to advanced chips." },
    { start: 80, end: 87, text: "This is on the President Trump had been pushing for from the start and it was interesting to hear from the U.S. Treasury" },
    { start: 87, end: 93, text: "Secretary in interview over the weekend appeared to soften his stance going into this week saying he would leave the door" },
    { start: 93, end: 101, text: "open to having Jensen Huang coming back as the chief executive after previously calling for what he called for a" },
    { start: 101, end: 116, text: "dramatic shakeup in leadership. His quote to CBS was I said they should go to the outside but he is now on the outside so interesting needle we saw the Treasury Secretary thread." },
    { start: 116, end: 119, text: "A flurry of oversight efforts by Washington." },
    { start: 119, end: 125, text: "We have not heard from the Attorney General to confirm a statement put out on his post." },
    { start: 125, end: 135, text: "We know the DOJ is investigating Nvidia and Megaspeed, the company at the center of this controversy." },
    { start: 135, end: 142, text: "The report over the weekend the SEC is looking into Nvidia's accounting practices. Capitol Hill is gearing up for a" },
    { start: 142, end: 152, text: "flurry of testimony, Jensen Huang is expected among the China Select Committee and that's going to be" },
    { start: 152, end: 159, text: "behind closed doors. We should say we did get confirmation that there will also be public testimony." }
  ]
};

let player = null;
let playerReady = false;
let loopSegment = false;
let activeSegIdx = -1;
let lastSeekTime = 0;

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function buildSegments() {
  document.getElementById('videoTitle').textContent = VIDEO_DATA.title;
  const container = document.getElementById('transcript');
  container.innerHTML = '';

  VIDEO_DATA.segments.forEach((seg, sIdx) => {
    const segDiv = document.createElement('div');
    segDiv.className = 'segment';
    segDiv.id = 'seg-' + sIdx;

    const tsDiv = document.createElement('div');
    tsDiv.className = 'ts';
    tsDiv.textContent = formatTime(seg.start);
    tsDiv.onclick = () => jumpTo(seg.start, sIdx, -1);

    const wordsDiv = document.createElement('div');
    wordsDiv.className = 'words';

    const tokens = seg.text.trim().split(/\s+/);
    const totalChars = tokens.reduce((acc, w) => acc + w.length, 0) || 1;
    const dur = Math.max(0.5, (seg.end || seg.start + 3) - seg.start);
    let cursor = seg.start;
    const wordItems = tokens.map(w => {
      const wStart = cursor;
      const wDur = dur * (w.length / totalChars);
      cursor += wDur;
      return { text: w, start: wStart, end: cursor };
    });

    seg._computedWords = wordItems;

    wordItems.forEach((w, wIdx) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w.text;
      span.dataset.seg = sIdx;
      span.dataset.word = wIdx;
      span.onclick = (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('blind')) {
          span.classList.add('peek');
          setTimeout(() => span.classList.remove('peek'), 1800);
        }
        jumpTo(w.start, sIdx, wIdx);
      };
      wordsDiv.appendChild(span);
      wordsDiv.appendChild(document.createTextNode(' '));
    });

    segDiv.appendChild(tsDiv);
    segDiv.appendChild(wordsDiv);
    container.appendChild(segDiv);
  });
}

function jumpTo(timeSec, sIdx, wIdx) {
  if (!playerReady) return;
  const target = Math.max(0, timeSec - 0.12);
  lastSeekTime = Date.now();
  activeSegIdx = sIdx;
  player.seekTo(target, true);
  player.playVideo();
  highlightPosition(sIdx, wIdx);
}

function highlightPosition(sIdx, wIdx) {
  document.querySelectorAll('.segment.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));

  if (sIdx >= 0) {
    const segEl = document.getElementById('seg-' + sIdx);
    if (segEl) {
      segEl.classList.add('active');
      if (wIdx >= 0) {
        const wEl = segEl.querySelector(`.word[data-word="${wIdx}"]`);
        if (wEl) wEl.classList.add('active');
      }
    }
  }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    host: 'https://www.youtube-nocookie.com',
    events: {
      onReady: () => { playerReady = true; },
      onStateChange: (e) => {
        const btn = document.getElementById('btnPlay');
        btn.textContent = (e.data === YT.PlayerState.PLAYING) ? '⏸ 일시정지' : '▶ 재생';
      }
    }
  });
}

function togglePlay() {
  if (!playerReady) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function seekRelative(delta) {
  if (!playerReady) return;
  const cur = player.getCurrentTime();
  player.seekTo(Math.max(0, cur + delta), true);
}

function toggleLoop() {
  loopSegment = !loopSegment;
  document.getElementById('btnLoop').classList.toggle('active', loopSegment);
}

function toggleBlind() {
  const isBlind = document.body.classList.toggle('blind');
  document.getElementById('btnBlind').classList.toggle('active', isBlind);
}

function setSpeed(rate) {
  if (playerReady) player.setPlaybackRate(rate);
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
  });
}

setInterval(() => {
  if (!playerReady || player.getPlayerState() !== YT.PlayerState.PLAYING) return;
  if (Date.now() - lastSeekTime < 350) return;

  const t = player.getCurrentTime();
  if (loopSegment && activeSegIdx >= 0) {
    const curSeg = VIDEO_DATA.segments[activeSegIdx];
    if (curSeg && t >= curSeg.end) {
      player.seekTo(curSeg.start, true);
      return;
    }
  }

  let foundSeg = -1;
  let foundWord = -1;
  for (let i = 0; i < VIDEO_DATA.segments.length; i++) {
    const s = VIDEO_DATA.segments[i];
    if (t >= s.start && t <= (s.end || s.start + 10)) {
      foundSeg = i;
      const words = s._computedWords || [];
      for (let j = 0; j < words.length; j++) {
        if (t >= words[j].start && t <= words[j].end) {
          foundWord = j;
          break;
        }
      }
      break;
    }
  }

  if (foundSeg !== -1) {
    activeSegIdx = foundSeg;
    highlightPosition(foundSeg, foundWord);
  }
}, 150);

buildSegments();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
