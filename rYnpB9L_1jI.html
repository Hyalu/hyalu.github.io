<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어 듣기 학습 · 트럼프, 젠슨 황의 엔비디아 복귀 환영</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-active: #1e3a5f;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.18);
    --word-active: #fbbf24;
    --border: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }
  .top-pane {
    flex-shrink: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    max-height: 28dvh;
    background: #000;
  }
  #player {
    width: 100%;
    height: 100%;
  }
  .controls {
    max-width: 720px;
    margin: 0 auto;
    padding: 6px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
    justify-content: space-between;
    background: #131c31;
  }
  .btn-group {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:active { transform: scale(0.96); }
  button.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }
  .transcript-pane {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 12px 60px;
  }
  .video-meta {
    margin-bottom: 10px;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .video-title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 3px;
  }
  .video-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }
  .segment {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .segment.active {
    background: var(--card-active);
    border-color: var(--accent);
  }
  .ts {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
    cursor: pointer;
    user-select: none;
  }
  .words {
    font-size: 16px;
    line-height: 1.75;
    word-break: keep-all;
  }
  .word {
    display: inline-block;
    padding: 1px 3px;
    margin: 0 1px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .word:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  .word.active {
    background: rgba(251, 191, 36, 0.25);
    color: var(--word-active);
    font-weight: 700;
  }
  body.blind .word {
    color: transparent;
    background: #334155;
    border-radius: 5px;
  }
  body.blind .word.peek,
  body.blind .word.active {
    color: var(--word-active);
    background: rgba(251, 191, 36, 0.2);
  }
  .footer-note {
    margin-top: 16px;
    padding: 10px;
    border-radius: 10px;
    background: #131c31;
    border: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="top-pane">
  <div class="player-wrap">
    <iframe id="player"
      src="https://www.youtube-nocookie.com/embed/rYnpB9L_1jI?enablejsapi=1&playsinline=1&rel=0"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
  <div class="controls">
    <div class="btn-group">
      <button id="btnPlay" onclick="togglePlay()">▶ 재생</button>
      <button onclick="seekRelative(-3)">⏪ -3초</button>
      <button id="btnLoop" onclick="toggleLoop()">🔁 반복</button>
      <button id="btnBlind" onclick="toggleBlind()">🙈 가리기</button>
    </div>
    <div class="btn-group">
      <button class="speed-btn" data-rate="0.75" onclick="setSpeed(0.75)">0.75x</button>
      <button class="speed-btn active" data-rate="1" onclick="setSpeed(1)">1.0x</button>
      <button class="speed-btn" data-rate="1.25" onclick="setSpeed(1.25)">1.25x</button>
    </div>
    <div class="btn-group">
      <button onclick="adjustSync(-0.5)">⏱ -0.5s</button>
      <button id="syncLabel" onclick="resetSync()" title="누르면 0초로 초기화">싱크 0.0s</button>
      <button onclick="adjustSync(0.5)">⏱ +0.5s</button>
    </div>
  </div>
</div>

<div class="transcript-pane" id="transcriptPane">
  <div class="container">
    <div class="video-meta">
      <p class="video-title" id="videoTitle"></p>
      <p class="video-hint">단어를 누르면 해당 음성으로 이동합니다. 위 영상과 아래 스크립트가 분리되어 가려지지 않아요.</p>
    </div>
    <div id="transcript"></div>
    <div class="footer-note">
      Bloomberg Television (2026.11.23) · 생방송 자막 지연(-5초) 보정 및 오인식 문구 정리본
    </div>
  </div>
</div>

<script>
// 생방송 자막은 실제 음성보다 ~5초 늦게 기록되어 시작 시간을 -5초 기준으로 보정했습니다.
const VIDEO_DATA = {
  videoId: "rYnpB9L_1jI",
  title: "트럼프, 젠슨 황의 엔비디아 복귀 환영 · Bloomberg Television (2:39)",
  segments: [
    { start: 0, end: 4.5, text: "Isabelle: S&P futures hitting highs. Nvidia higher in the premarket. I want to bring in Tyler Kendall." },
    { start: 4.5, end: 11.5, text: "Can you talk to us about what this will mean for the government? We know that over the weekend --" },
    { start: 11.5, end: 22.0, text: "We know that there were some talks, maybe Trump was saying last minute he wants Jensen Huang back, and now it's been established their decision may be influenced by senior officials." },
    { start: 22.0, end: 33.0, text: "Talk about the context of that and what it could mean moving forward if we keep having government influence over decisions for companies like Nvidia." },
    { start: 33.0, end: 41.0, text: "Tyler: There is no doubt, news from this White House as you heard moments ago about this statement from President Trump," },
    { start: 41.0, end: 50.0, text: "saying this will ensure the success and prosperity of not only the company but the American economy, giving us a little more insight into what President Trump was" },
    { start: 50.0, end: 57.0, text: "watching here. And then, as you outlined, he also seems to claim the U.S. Attorney General confirmed the government does" },
    { start: 57.0, end: 63.0, text: "not possess evidence that Jensen Huang has engaged in unlawful conduct, but did say he thinks the board should continue to" },
    { start: 63.0, end: 75.0, text: "investigate Nvidia's compliance with U.S. export controls, which the U.S. government just sought to tighten in a bid to restrict access to advanced chips." },
    { start: 75.0, end: 82.0, text: "This is something President Trump had been pushing for from the start, and it was interesting to hear from the U.S. Treasury" },
    { start: 82.0, end: 88.0, text: "Secretary in an interview over the weekend. He appeared to soften his stance going into this week, saying he would leave the door" },
    { start: 88.0, end: 96.0, text: "open to having Jensen Huang come back as the chief executive, after previously calling for what he described as a" },
    { start: 96.0, end: 111.0, text: "dramatic shakeup in leadership. His quote to CBS was: 'I said they should go to the outside, but he is now on the outside.' So, an interesting needle we saw the Treasury Secretary thread." },
    { start: 111.0, end: 114.5, text: "A flurry of oversight efforts by Washington." },
    { start: 114.5, end: 120.5, text: "We have not heard from the Attorney General to confirm what the President put out in his post." },
    { start: 120.5, end: 130.0, text: "We know the DOJ is investigating Nvidia and Megaspeed, the company at the center of this controversy." },
    { start: 130.0, end: 137.0, text: "There was a report over the weekend that the SEC is looking into Nvidia's accounting practices. Capitol Hill is gearing up for a" },
    { start: 137.0, end: 147.0, text: "flurry of testimony. Jensen Huang is expected before the China Select Committee, and that's going to be" },
    { start: 147.0, end: 159.0, text: "behind closed doors. We should say we did get confirmation that there will also be public testimony." }
  ]
};

let player = null;
let playerReady = false;
let loopSegment = false;
let activeSegIdx = -1;
let lastSeekTime = 0;
let syncOffset = 0;
let lastScrolledSeg = -1;

function adjustSync(delta) {
  syncOffset = Math.round((syncOffset + delta) * 10) / 10;
  updateSyncLabel();
}
function resetSync() {
  syncOffset = 0;
  updateSyncLabel();
}
function updateSyncLabel() {
  const el = document.getElementById('syncLabel');
  const sign = syncOffset > 0 ? '+' : '';
  el.textContent = `싱크 ${sign}${syncOffset.toFixed(1)}s`;
  el.classList.toggle('active', syncOffset !== 0);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function buildSegments() {
  document.getElementById('videoTitle').textContent = VIDEO_DATA.title;
  const container = document.getElementById('transcript');
  container.innerHTML = '';

  VIDEO_DATA.segments.forEach((seg, sIdx) => {
    const segDiv = document.createElement('div');
    segDiv.className = 'segment';
    segDiv.id = 'seg-' + sIdx;

    const tsDiv = document.createElement('div');
    tsDiv.className = 'ts';
    tsDiv.textContent = formatTime(seg.start);
    tsDiv.onclick = () => jumpTo(seg.start, sIdx, -1);

    const wordsDiv = document.createElement('div');
    wordsDiv.className = 'words';

    const tokens = seg.text.trim().split(/\s+/);
    const totalChars = tokens.reduce((acc, w) => acc + w.length, 0) || 1;
    const dur = Math.max(0.5, (seg.end || seg.start + 3) - seg.start);
    let cursor = seg.start;
    const wordItems = tokens.map(w => {
      const wStart = cursor;
      const wDur = dur * (w.length / totalChars);
      cursor += wDur;
      return { text: w, start: wStart, end: cursor };
    });

    seg._computedWords = wordItems;

    wordItems.forEach((w, wIdx) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w.text;
      span.dataset.seg = sIdx;
      span.dataset.word = wIdx;
      span.onclick = (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('blind')) {
          span.classList.add('peek');
          setTimeout(() => span.classList.remove('peek'), 1800);
        }
        jumpTo(w.start, sIdx, wIdx);
      };
      wordsDiv.appendChild(span);
      wordsDiv.appendChild(document.createTextNode(' '));
    });

    segDiv.appendChild(tsDiv);
    segDiv.appendChild(wordsDiv);
    container.appendChild(segDiv);
  });
}

function jumpTo(timeSec, sIdx, wIdx) {
  if (!playerReady) return;
  const target = Math.max(0, timeSec + syncOffset - 0.15);
  lastSeekTime = Date.now();
  activeSegIdx = sIdx;
  lastScrolledSeg = sIdx;
  player.seekTo(target, true);
  player.playVideo();
  highlightPosition(sIdx, wIdx, false);
}

function highlightPosition(sIdx, wIdx, autoScroll = true) {
  document.querySelectorAll('.segment.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));

  if (sIdx >= 0) {
    const segEl = document.getElementById('seg-' + sIdx);
    if (segEl) {
      segEl.classList.add('active');
      if (autoScroll && sIdx !== lastScrolledSeg) {
        lastScrolledSeg = sIdx;
        segEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      if (wIdx >= 0) {
        const wEl = segEl.querySelector(`.word[data-word="${wIdx}"]`);
        if (wEl) wEl.classList.add('active');
      }
    }
  }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    host: 'https://www.youtube-nocookie.com',
    events: {
      onReady: () => { playerReady = true; },
      onStateChange: (e) => {
        const btn = document.getElementById('btnPlay');
        btn.textContent = (e.data === YT.PlayerState.PLAYING) ? '⏸ 일시정지' : '▶ 재생';
      }
    }
  });
}

function togglePlay() {
  if (!playerReady) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function seekRelative(delta) {
  if (!playerReady) return;
  const cur = player.getCurrentTime();
  player.seekTo(Math.max(0, cur + delta), true);
}

function toggleLoop() {
  loopSegment = !loopSegment;
  document.getElementById('btnLoop').classList.toggle('active', loopSegment);
}

function toggleBlind() {
  const isBlind = document.body.classList.toggle('blind');
  document.getElementById('btnBlind').classList.toggle('active', isBlind);
}

function setSpeed(rate) {
  if (playerReady) player.setPlaybackRate(rate);
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
  });
}

setInterval(() => {
  if (!playerReady || player.getPlayerState() !== YT.PlayerState.PLAYING) return;
  if (Date.now() - lastSeekTime < 1000) return;

  const t = player.getCurrentTime() - syncOffset;
  if (loopSegment && activeSegIdx >= 0) {
    const curSeg = VIDEO_DATA.segments[activeSegIdx];
    if (curSeg && t >= curSeg.end) {
      lastSeekTime = Date.now();
      player.seekTo(Math.max(0, curSeg.start + syncOffset), true);
      return;
    }
  }

  let foundSeg = -1;
  let foundWord = -1;
  for (let i = 0; i < VIDEO_DATA.segments.length; i++) {
    const s = VIDEO_DATA.segments[i];
    if (t >= s.start && t < (s.end || s.start + 10)) {
      foundSeg = i;
      const words = s._computedWords || [];
      for (let j = 0; j < words.length; j++) {
        if (t >= words[j].start && t < words[j].end) {
          foundWord = j;
          break;
        }
      }
      break;
    }
  }

  if (foundSeg !== -1) {
    activeSegIdx = foundSeg;
    highlightPosition(foundSeg, foundWord, true);
  }
}, 150);

buildSegments();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
